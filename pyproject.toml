[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poe-workflow"
version = "0.1.0"
description = "Standalone workflow orchestration engine (extracted from poe-mapmaker, Phase 1: pure-Python core)"
readme = "README.md"
requires-python = ">=3.9"
# Phase 1 内核为零依赖纯 Python；PyQt5 仅 UI 层（Phase 2 抽取）需要。
dependencies = []

[project.optional-dependencies]
ui = ["PyQt5>=5.15"]

[tool.setuptools.packages.find]
where = ["."]
include = ["poe_workflow*"]
