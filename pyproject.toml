[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poe-workflow"
version = "0.1.0"
description = "Standalone workflow orchestration engine + PyQt5 UI cluster (extracted from poe-mapmaker, Phase 1 core + Phase 2a UI)"
readme = "README.md"
requires-python = ">=3.9"
# 内核为零依赖纯 Python；PyQt5 仅 UI 层（Phase 2a 迁入的 ui/ 子包）需要。
dependencies = []

[project.optional-dependencies]
ui = ["PyQt5>=5.15"]

[tool.setuptools.packages.find]
where = ["."]
include = ["poe_workflow*"]
exclude = ["poe_workflow.tests", "poe_workflow.tests.*"]

[tool.setuptools.package-data]
poe_workflow = ["workflows/*.json"]
